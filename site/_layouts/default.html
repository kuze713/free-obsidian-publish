<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" href="{{ site.logo_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Source+Code+Pro:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body data-baseurl="{{ site.baseurl }}">
  <header class="topbar">
    <button id="menu-toggle" aria-label="Toggle menu">&#9776;</button>
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </header>
  <button id="theme-toggle" class="theme-toggle" aria-label="Switch light/dark mode" title="Switch light/dark mode"></button>
  <aside class="sidebar" id="sidebar">{% include sidebar.html %}</aside>
  <main class="content"><article class="prose" id="prose">{{ content }}</article></main>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
